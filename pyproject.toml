[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src/meeting-agent"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["meeting_agent"]
mypy_path = "src/meeting-agent"